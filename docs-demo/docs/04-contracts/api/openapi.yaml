openapi: 3.0.3
info:
  title: SaaS Demo Platform API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: 登录成功，返回 Access Token 并设置 Refresh Token Cookie
        "401":
          description: 邮箱或密码错误
