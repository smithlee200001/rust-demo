[package]
name = "log-demo"
version = "0.1.0"
edition = "2024"
default-run = "log-demo"

[dependencies]
# 引入官方 log 库，开启 std、kv 和 kv_serde（支持 Serialize 结构化日志）特性
log = { version = "0.4", features = ["std", "kv", "kv_serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
age = "=0.12.1"
rpassword = "7"
tempfile = "3"
